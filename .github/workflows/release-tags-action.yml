name: release-tag

on:
  push:
    tags:
      - "*-release"

permissions:
  contents: write

jobs:
  release-tag:
    name: Tagged Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build release package
        run: bash release.sh -d -m pkgmeta.yaml

      - name: Verify release package
        shell: bash
        run: |
          shopt -s nullglob
          packages=(.release/*.zip)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::release.sh did not create a ZIP package"
            exit 1
          fi
          printf 'Release package: %s\n' "${packages[@]}"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          packages=(.release/*.zip)

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${packages[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${packages[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$TAG_NAME"
