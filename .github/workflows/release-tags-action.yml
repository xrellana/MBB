name: release-tag

on:
  push:
    tags:
      - "*-release"

permissions:
  contents: write

jobs:
  release-tag:
    name: Tagged Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build release package
        run: bash release.sh -d -u -m pkgmeta.yaml

      - name: Verify release package
        shell: bash
        run: |
          expected=(
            CHANGELOG.md
            LICENSE
            MBB.lua
            MBB.toc
            MBB.xml
            localization-deDE.lua
            localization-enGB.lua
            localization-frFR.lua
            localization-koKR.lua
            localization-ruRU.lua
            localization-zhCN.lua
            localization-zhTW.lua
          )
          mapfile -t actual < <(find .release/MBB -type f -printf '%P\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if ! diff -u \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${actual[@]}"); then
            echo "::error::release package contains missing or unexpected files"
            exit 1
          fi

          crlf_files="$(grep -rIl $'\r' .release/MBB || true)"
          if [[ -n "$crlf_files" ]]; then
            printf '%s\n' "$crlf_files"
            echo "::error::release package contains CRLF line endings"
            exit 1
          fi

          shopt -s nullglob
          packages=(.release/*.zip)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::release.sh did not create a ZIP package"
            exit 1
          fi
          printf 'Release package: %s\n' "${packages[@]}"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          packages=(.release/*.zip)

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${packages[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${packages[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$TAG_NAME"
          fi
